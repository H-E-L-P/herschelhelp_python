# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://github.com/pypa/gh-action-pypi-publish#trusted-publishing

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          # setuptools-scm needs the tags
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Check version matches tag
      run: |
        ls dist/
        VERSION="${GITHUB_REF_NAME#v}"
        ls dist/ | grep -q -- "-${VERSION}" || { echo "Built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
